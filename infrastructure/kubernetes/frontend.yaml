apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-frontend
  namespace: travel-booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-frontend
  template:
    metadata:
      labels:
        app: travel-frontend
    spec:
      containers:
        - name: frontend
          image: travel-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://travel-api:3001/api"
---
apiVersion: v1
kind: Service
metadata:
  name: travel-frontend
  namespace: travel-booking
spec:
  selector:
    app: travel-frontend
  ports:
    - port: 3000
      targetPort: 3000
