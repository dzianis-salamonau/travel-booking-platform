apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-api
  namespace: travel-booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-api
  template:
    metadata:
      labels:
        app: travel-api
    spec:
      containers:
        - name: api
          image: travel-api:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: travel-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: travel-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: travel-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: travel-secrets
                  key: JWT_REFRESH_SECRET
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: travel-api
  namespace: travel-booking
spec:
  selector:
    app: travel-api
  ports:
    - port: 3001
      targetPort: 3001
