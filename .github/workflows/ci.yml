name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel
          POSTGRES_DB: travel_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: |
          pnpm --filter @travel/shared-types build
          pnpm --filter @travel/provider-sdk build

      - name: Generate Prisma client
        run: pnpm --filter @travel/backend exec prisma generate
        env:
          DATABASE_URL: postgresql://travel:travel@localhost:5432/travel_booking?schema=public

      - name: Run migrations
        run: pnpm --filter @travel/backend exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://travel:travel@localhost:5432/travel_booking?schema=public

      - name: Lint
        run: pnpm lint

      - name: Build backend
        run: pnpm --filter @travel/backend build

      - name: Build frontend
        run: pnpm --filter @travel/frontend build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

      - name: Seed database
        run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://travel:travel@localhost:5432/travel_booking?schema=public

      - name: Test
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t travel-api:latest .

      - name: Build Frontend image
        run: docker build -f infrastructure/docker/Dockerfile.frontend -t travel-frontend:latest .
